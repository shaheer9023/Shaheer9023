<svg width="860" height="200" viewBox="0 0 860 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0c040"/>
      <stop offset="100%" style="stop-color:#c9a96e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="200" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="430" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#8b949e" letter-spacing="3">SKILL TROPHIES</text>
  <line x1="60" y1="36" x2="340" y2="36" stroke="#30363d" stroke-width="1"/>
  <line x1="520" y1="36" x2="800" y2="36" stroke="#30363d" stroke-width="1"/>

  <!-- Trophy 1: n8n Automation -->
  <g transform="translate(45, 55)">
    <text x="55" y="28" text-anchor="middle" font-size="32" filter="url(#glow)">🏆</text>
    <text x="55" y="58" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="700" fill="url(#gold)">n8n Expert</text>
    <text x="55" y="73" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#8b949e">Workflow Automation</text>
    <rect x="5" y="85" width="100" height="3" rx="2" fill="#30363d"/>
    <rect x="5" y="85" width="100" height="3" rx="2" fill="url(#gold)" opacity="0.9"/>
  </g>

  <!-- Trophy 2: Agentic AI -->
